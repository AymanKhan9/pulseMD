services:
  - type: web
    name: pulsemd-backend
    runtime: node
    buildCommand: npm install
    startCommand: node backend/index.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: REACT_APP_API_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_TOKEN_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
